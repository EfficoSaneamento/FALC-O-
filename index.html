<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falcão SST · Gestão 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:            #f5f6f3;
    --surface:        #ffffff;
    --border:         #dde0d7;
    --institutional:  #4f6142;
    --accent:         #7a9c52;
    --accent-tint:    #eef3e7;
    --text:           #22281d;
    --text-dim:       #6b7566;
    --white:          #ffffff;

    --farol-verde-bg:    #e8f5e9; --farol-verde-bd:    #a5d6a7; --farol-verde-tx:    #1b5e20;
    --farol-amarelo-bg:  #fff8e1; --farol-amarelo-bd:  #ffd54f; --farol-amarelo-tx:  #8a6100;
    --farol-vermelho-bg: #fdecea; --farol-vermelho-bd: #ef9a9a; --farol-vermelho-tx: #a01f1f;

    --cat-legal:    #3b6ea5;
    --cat-praticas: #5b8c5a;
    --cat-campo:    #c98a2c;
    --cat-deflator: #b34a3f;

    --f-display: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    --f-body:    'Inter', -apple-system, 'Segoe UI', sans-serif;

    --radius: 6px;
    --gutter: clamp(20px, 5vw, 64px);
    --maxw: 1360px;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--f-body);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .container{ max-width:var(--maxw); margin-inline:auto; padding-inline:var(--gutter); }
  ::selection{ background:var(--accent-tint); color:var(--text); }

  /* ---- navbar ---- */
  .navbar{
    position:sticky; top:0; z-index:100;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .navbar__inner{
    display:flex; align-items:center; justify-content:space-between;
    gap:24px; height:66px; flex-wrap:wrap;
  }
  .navbar__brand{ display:flex; align-items:center; gap:12px; }
  .navbar__mark{ width:28px; height:28px; border:1.5px solid var(--institutional); border-radius:4px; position:relative; flex-shrink:0; }
  .navbar__mark::before, .navbar__mark::after{ content:''; position:absolute; background:var(--institutional); }
  .navbar__mark::before{ top:50%; left:22%; right:22%; height:1.5px; transform:translateY(-50%); }
  .navbar__mark::after{ left:50%; top:22%; bottom:22%; width:1.5px; transform:translateX(-50%); }
  .navbar__name{ display:flex; flex-direction:column; line-height:1.15; }
  .navbar__name b{ font-family:var(--f-display); font-weight:800; font-size:15px; letter-spacing:0.01em; color:var(--text); }
  .navbar__name span{ font-size:11px; color:var(--text-dim); letter-spacing:0.03em; }
  .navbar__meta{ font-size:12px; color:var(--text-dim); }

  .month-select{
    font-family:var(--f-body); font-size:13px;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:8px 12px; border-radius:4px; cursor:pointer;
  }
  .month-select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .page-body{ padding-block:32px 96px; }

  /* ---- KPI row ---- */
  .kpi-row{
    display:grid; grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:28px;
  }
  .kpi{ border:1px solid var(--border); border-radius:var(--radius); padding:18px 18px; background:var(--surface); }
  .kpi__label{ font-size:11.5px; letter-spacing:0.02em; color:var(--text-dim); margin-bottom:8px; }
  .kpi__value{ font-weight:700; font-size:1.55rem; color:var(--text); }
  .kpi__sub{ font-size:11.5px; color:var(--text-dim); margin-top:6px; }
  .kpi.is-negative .kpi__value{ color:var(--farol-vermelho-tx); }
  .kpi.is-highlight{ background:var(--accent-tint); border-color:var(--accent); }
  .kpi.is-highlight .kpi__label{ color:var(--institutional); }
  .kpi.is-highlight .kpi__value{ color:var(--institutional); font-size:1.75rem; }
  @media (max-width:900px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:480px){ .kpi-row{ grid-template-columns:1fr; } }

  /* ---- layout ---- */
  .split{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; margin-bottom:20px; align-items:start; }
  @media (max-width:960px){ .split{ grid-template-columns:1fr; } }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
  .panel h3{ font-size:13px; font-weight:700; letter-spacing:0.01em; color:var(--institutional); margin:0 0 16px; text-transform:uppercase; }
  .panel-scroll{ max-height:420px; overflow-y:auto; }

  /* ---- data table ---- */
  .data-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .data-table th{
    text-align:left; font-size:11px; letter-spacing:0.02em; text-transform:uppercase;
    color:var(--text-dim); padding:8px 10px; border-bottom:2px solid var(--border);
    background:var(--surface);
  }
  .data-table td{ padding:10px 10px; border-bottom:1px solid var(--border); color:var(--text); }
  .data-table tr{ cursor:pointer; }
  .data-table tr:hover td{ background:var(--bg); }
  .data-table tr.is-selected td{ background:var(--accent-tint); }
  .data-table td.num{ text-align:right; }

  .tag{
    font-size:11px; letter-spacing:0.01em; padding:3px 9px;
    border-radius:4px; border:1px solid var(--border); color:var(--text-dim);
    background:var(--bg); white-space:nowrap; display:inline-block;
  }
  .tag.farol{ font-weight:600; }
  .tag.farol-verde{ color:var(--farol-verde-tx); background:var(--farol-verde-bg); border-color:var(--farol-verde-bd); }
  .tag.farol-amarelo{ color:var(--farol-amarelo-tx); background:var(--farol-amarelo-bg); border-color:var(--farol-amarelo-bd); }
  .tag.farol-vermelho{ color:var(--farol-vermelho-tx); background:var(--farol-vermelho-bg); border-color:var(--farol-vermelho-bd); }
  .tag-list{ display:flex; flex-wrap:wrap; gap:6px; }

  /* ---- detail panel ---- */
  .detail-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .detail-head__id{ font-weight:700; font-size:1.15rem; color:var(--text); }
  .detail-head__meta{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .detail-score{ text-align:right; }
  .detail-score__value{ font-weight:700; font-size:1.6rem; color:var(--institutional); }
  .detail-score__scale{ font-size:11px; color:var(--text-dim); margin-bottom:6px; }

  .subscore-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
  @media (max-width:640px){ .subscore-grid{ grid-template-columns:repeat(2,1fr); } }
  .subscore{ background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:10px 12px; }
  .subscore__label{ font-size:10.5px; color:var(--text-dim); }
  .subscore__value{ font-size:1.05rem; font-weight:600; color:var(--text); margin-top:4px; }

  .mini-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:18px; }
  .mini-table td{ padding:6px 0; border-bottom:1px solid var(--border); color:var(--text-dim); }
  .mini-table td:last-child{ text-align:right; color:var(--text); font-weight:600; }
  .mini-table tr:last-child td{ border-bottom:none; }

  .detail-block{ margin-bottom:18px; }
  .detail-block:last-child{ margin-bottom:0; }
  .detail-block__label{ font-size:11px; letter-spacing:0.02em; text-transform:uppercase; color:var(--institutional); font-weight:700; margin-bottom:8px; }
  .detail-block__prose{ font-size:12.5px; color:var(--text); line-height:1.5; }

  canvas{ max-width:100%; }
  .composicao-wrap{ position:relative; }

  .state-msg{ text-align:center; padding:80px 20px; color:var(--text-dim); font-size:13px; }
  .state-msg code{ background:var(--bg); padding:2px 6px; border-radius:4px; color:var(--institutional); }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container navbar__inner">
    <div class="navbar__brand">
      <div class="navbar__mark"></div>
      <div class="navbar__name">
        <b>FALCÃO SST · GESTÃO 360</b>
        <span>EFFICO SANEAMENTO</span>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <span class="navbar__meta" id="updated-at"></span>
      <select id="mes-select" class="month-select"></select>
    </div>
  </div>
</nav>

<div id="app" hidden>
  <div class="container page-body">
    <section class="kpi-row" id="kpi-row"></section>

    <section class="split">
      <div class="panel">
        <h3 id="ranking-title">Ranking de contratos</h3>
        <div class="panel-scroll">
          <table class="data-table" id="tabela-ranking">
            <thead>
              <tr>
                <th>PC</th>
                <th>Diretor</th>
                <th>Gerente</th>
                <th class="num">Nota</th>
                <th>Farol</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <h3>Evolução da nota média SST</h3>
        <canvas id="chart-evolucao" height="220"></canvas>
      </div>
    </section>

    <section class="split">
      <div class="panel" id="panel-detalhe"></div>
      <div class="panel">
        <h3>Farol dos contratos no mês</h3>
        <canvas id="chart-farol" height="220"></canvas>
      </div>
    </section>

    <section class="panel">
      <h3>Composição da nota por contrato — conformidade legal · boas práticas · conformidade campo · deflatores</h3>
      <div class="composicao-wrap">
        <canvas id="chart-composicao"></canvas>
      </div>
    </section>
  </div>
</div>

<div class="state-msg" id="state-msg">Carregando dados…</div>

<script>
const FAROL_LABEL = { verde: "Verde", amarelo: "Amarelo", vermelho: "Vermelho" };
const FAROL_ICON = { verde: "🟢", amarelo: "🟡", vermelho: "🔴" };

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// Escapa texto vindo do ArcGIS antes de inserir no innerHTML — campos de
// texto (diretor, gerente, resumos) são preenchidos por usuários do
// formulário e não podem ser tratados como HTML confiável.
function esc(v) {
  if (v === null || v === undefined) return "—";
  return String(v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function fmtNota(v, opts) {
  if (v === null || v === undefined) return "—";
  return Number(v).toLocaleString("pt-BR", { maximumFractionDigits: (opts && opts.decimals) ?? 1 });
}

function farolTag(farol) {
  return `<span class="tag farol farol-${esc(farol)}">${FAROL_ICON[farol] || ""} ${esc(FAROL_LABEL[farol] || farol)}</span>`;
}

let DATA = null;
let selectedPc = null;
let charts = {};

Chart.defaults.font.family = "'Inter', -apple-system, 'Segoe UI', sans-serif";
Chart.defaults.font.size = 11;
Chart.defaults.color = "#6b7566";

function registrosDoMes(mesAno) {
  return DATA.registros.filter(r => r.mes_ano === mesAno);
}

function renderKPIs(mesAno) {
  const registros = registrosDoMes(mesAno);
  const total = registros.length;
  const avg = (key) => total > 0 ? registros.reduce((s, r) => s + (r[key] || 0), 0) / total : 0;
  const sum = (key) => registros.reduce((s, r) => s + (r[key] || 0), 0);
  const acidentes = sum("qtd_acidentes");
  const fatalidades = sum("qtd_fatalidades");
  const counts = { verde: 0, amarelo: 0, vermelho: 0 };
  registros.forEach(r => { counts[r.farol] = (counts[r.farol] || 0) + 1; });

  const tiles = [
    { label: "Contratos monitorados", value: total, sub: "no período" },
    { label: "Nota conformidade legal", value: fmtNota(avg("nota_documento")), sub: "média do período" },
    { label: "Nota boas práticas", value: fmtNota(avg("nota_evento")), sub: "média do período" },
    { label: "Nota conformidade campo", value: fmtNota(avg("nota_ocorrencia")), sub: "média do período" },
    { label: "Nota deflatores", value: fmtNota(sum("nota_deflatores")), sub: "soma do período", negative: true },
    { label: "Acidentes / fatalidades", value: `${acidentes} / ${fatalidades}`, sub: "no período" },
    { label: "Farol · verde / amarelo / vermelho", value: `${counts.verde} / ${counts.amarelo} / ${counts.vermelho}`, sub: `${total > 0 ? Math.round((counts.verde/total)*100) : 0}% verde` },
    { label: "Nota Falcão", value: fmtNota(avg("nota_effico_sst")), sub: "média do período", highlight: true },
  ];

  document.getElementById("kpi-row").innerHTML = tiles.map(t => `
    <div class="kpi ${t.negative ? "is-negative" : ""} ${t.highlight ? "is-highlight" : ""}">
      <div class="kpi__label">${esc(t.label)}</div>
      <div class="kpi__value">${t.value}</div>
      <div class="kpi__sub">${esc(t.sub)}</div>
    </div>
  `).join("");
}

function renderRanking(mesAno) {
  const registros = registrosDoMes(mesAno).slice().sort((a, b) => (a.nota_effico_sst ?? 0) - (b.nota_effico_sst ?? 0));
  document.getElementById("ranking-title").textContent = `Ranking de contratos — ${DATA.registros.find(r => r.mes_ano === mesAno)?.mes_ano_label || ""}`;

  const tbody = document.querySelector("#tabela-ranking tbody");
  if (registros.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5">Nenhum registro para este mês.</td></tr>`;
    return;
  }
  if (!registros.some(r => r.id_pc === selectedPc)) {
    selectedPc = registros[0].id_pc;
  }
  tbody.innerHTML = registros.map(r => `
    <tr data-pc="${esc(r.id_pc)}" class="${r.id_pc === selectedPc ? "is-selected" : ""}">
      <td>${esc(r.id_pc)}</td>
      <td>${esc(r.diretor)}</td>
      <td>${esc(r.gerente)}</td>
      <td class="num">${fmtNota(r.nota_effico_sst)}</td>
      <td>${farolTag(r.farol)}</td>
    </tr>
  `).join("");

  tbody.querySelectorAll("tr[data-pc]").forEach(tr => {
    tr.addEventListener("click", () => {
      selectedPc = isNaN(Number(tr.dataset.pc)) ? tr.dataset.pc : Number(tr.dataset.pc);
      // Alterna so a classe da linha selecionada em vez de recriar o
      // tbody inteiro — reconstruir o innerHTML enquanto o painel esta
      // rolado disparava um glitch de repintura no Chromium.
      tbody.querySelectorAll("tr[data-pc]").forEach(row => {
        row.classList.toggle("is-selected", row.dataset.pc === String(selectedPc));
      });
      renderDetalhe(mesAno);
    });
  });
}

function renderDetalhe(mesAno) {
  const registros = registrosDoMes(mesAno);
  const r = registros.find(x => x.id_pc === selectedPc) || registros[0];
  const panel = document.getElementById("panel-detalhe");
  if (!r) {
    panel.innerHTML = `<h3>Detalhamento do contrato</h3><p style="color:var(--text-dim); font-size:12.5px;">Nenhum contrato no período.</p>`;
    return;
  }

  const docs = (r.documentos_reprovados && r.documentos_reprovados !== "Nenhum documento reprovado no período")
    ? r.documentos_reprovados.split(" • ").map(d => `<span class="tag">${esc(d)}</span>`).join("")
    : `<span style="color:var(--text-dim); font-size:12px;">Nenhum documento reprovado no período</span>`;

  panel.innerHTML = `
    <h3>Detalhamento do contrato</h3>
    <div class="detail-head">
      <div>
        <div class="detail-head__id">PC ${esc(r.id_pc)}</div>
        <div class="detail-head__meta">${esc(r.diretor)} · ${esc(r.gerente)} · ${esc(r.mes_ano_label)}</div>
      </div>
      <div class="detail-score">
        <div class="detail-score__value">${fmtNota(r.nota_effico_sst)}</div>
        <div class="detail-score__scale">de 2.300 pontos</div>
        ${farolTag(r.farol)}
      </div>
    </div>

    <div class="subscore-grid">
      <div class="subscore"><div class="subscore__label">Conformidade legal</div><div class="subscore__value">${fmtNota(r.nota_documento)}</div></div>
      <div class="subscore"><div class="subscore__label">Boas práticas</div><div class="subscore__value">${fmtNota(r.nota_evento)}</div></div>
      <div class="subscore"><div class="subscore__label">Conformidade campo</div><div class="subscore__value">${fmtNota(r.nota_ocorrencia)}</div></div>
      <div class="subscore"><div class="subscore__label">Deflatores</div><div class="subscore__value">${fmtNota(r.nota_deflatores)}</div></div>
    </div>

    <div class="detail-block">
      <div class="detail-block__label">Acidentes do período</div>
      <table class="mini-table">
        <tr><td>Total de acidentes</td><td>${r.qtd_acidentes ?? 0}</td></tr>
        <tr><td>Com afastamento</td><td>${r.qtd_acidentes_afastamento ?? 0}</td></tr>
        <tr><td>Sem afastamento</td><td>${r.qtd_acidentes_sem_afastamento ?? 0}</td></tr>
        <tr><td>Fatalidades</td><td>${r.qtd_fatalidades ?? 0}</td></tr>
      </table>
      <div class="detail-block__prose">${esc(r.resumo_acidentes)}</div>
    </div>

    <div class="detail-block">
      <div class="detail-block__label">Documentos reprovados</div>
      <div class="tag-list">${docs}</div>
    </div>

    <div class="detail-block">
      <div class="detail-block__label">Eventos SST</div>
      <table class="mini-table">
        <tr><td>Total realizado</td><td>${r.qtd_registros_eventos ?? 0}</td></tr>
        <tr><td>DDS</td><td>${r.qtd_dds ?? 0}</td></tr>
        <tr><td>Campanha SST</td><td>${r.qtd_campanha_sst ?? 0}</td></tr>
        <tr><td>Saúde mental</td><td>${r.qtd_saude_mental ?? 0}</td></tr>
      </table>
      <div class="detail-block__prose">${esc(r.eventos_realizados)}</div>
    </div>
  `;
}

function renderChartEvolucao() {
  const labels = DATA.evolucao_mensal.map(e => e.mes_ano_label);
  const valores = DATA.evolucao_mensal.map(e => e.media_nota_sst);
  const ctx = document.getElementById("chart-evolucao");
  if (charts.evolucao) charts.evolucao.destroy();
  charts.evolucao = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "Nota média SST",
        data: valores,
        borderColor: cssVar("--institutional"),
        backgroundColor: cssVar("--institutional"),
        borderWidth: 2,
        pointRadius: 3,
        pointHoverRadius: 5,
        tension: 0.25,
      }],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: cssVar("--border") }, ticks: { color: cssVar("--text-dim") } },
        y: { grid: { color: cssVar("--border") }, ticks: { color: cssVar("--text-dim") } },
      },
    },
  });
}

function renderChartFarol(mesAno) {
  const registros = registrosDoMes(mesAno);
  const counts = { verde: 0, amarelo: 0, vermelho: 0 };
  registros.forEach(r => { counts[r.farol] = (counts[r.farol] || 0) + 1; });

  const ctx = document.getElementById("chart-farol");
  if (charts.farol) charts.farol.destroy();
  charts.farol = new Chart(ctx, {
    type: "bar",
    data: {
      labels: ["Verde", "Amarelo", "Vermelho"],
      datasets: [{
        data: [counts.verde, counts.amarelo, counts.vermelho],
        backgroundColor: [cssVar("--farol-verde-tx"), cssVar("--farol-amarelo-tx"), cssVar("--farol-vermelho-tx")],
        borderRadius: 3,
      }],
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (c) => `${c.raw} contrato(s)` } },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: cssVar("--text-dim") } },
        y: { beginAtZero: true, ticks: { precision: 0, color: cssVar("--text-dim") }, grid: { color: cssVar("--border") } },
      },
    },
  });
}

function renderChartComposicao(mesAno) {
  const registros = registrosDoMes(mesAno).slice().sort((a, b) => (a.nota_effico_sst ?? 0) - (b.nota_effico_sst ?? 0));
  const labels = registros.map(r => `PC ${r.id_pc}`);
  const ctx = document.getElementById("chart-composicao");

  const container = ctx.parentElement;
  container.style.height = Math.max(220, registros.length * 32) + "px";
  ctx.style.height = "100%";

  if (charts.composicao) charts.composicao.destroy();
  charts.composicao = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [
        { label: "Conformidade legal", data: registros.map(r => r.nota_documento || 0), backgroundColor: cssVar("--cat-legal") },
        { label: "Boas práticas", data: registros.map(r => r.nota_evento || 0), backgroundColor: cssVar("--cat-praticas") },
        { label: "Conformidade campo", data: registros.map(r => r.nota_ocorrencia || 0), backgroundColor: cssVar("--cat-campo") },
        { label: "Deflatores", data: registros.map(r => r.nota_deflatores || 0), backgroundColor: cssVar("--cat-deflator") },
      ],
    },
    options: {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: "top", align: "start", labels: { color: cssVar("--text-dim"), boxWidth: 12, font: { size: 11 } } },
      },
      scales: {
        x: { stacked: true, grid: { color: cssVar("--border") }, ticks: { color: cssVar("--text-dim") } },
        y: { stacked: true, grid: { display: false }, ticks: { color: cssVar("--text-dim"), font: { size: 10.5 } } },
      },
    },
  });
}

function onMesChange() {
  const mesAno = document.getElementById("mes-select").value;
  selectedPc = null;
  renderKPIs(mesAno);
  renderRanking(mesAno);
  renderDetalhe(mesAno);
  renderChartFarol(mesAno);
  renderChartComposicao(mesAno);
}

function init(data) {
  DATA = data;
  document.getElementById("state-msg").hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("updated-at").textContent = data.gerado_em
    ? `Atualizado em ${new Date(data.gerado_em).toLocaleString("pt-BR")}`
    : "";

  const meses = data.evolucao_mensal.map(e => ({ value: e.mes_ano, label: e.mes_ano_label }));
  const select = document.getElementById("mes-select");
  select.innerHTML = meses.map(m => `<option value="${esc(m.value)}">${esc(m.label)}</option>`).join("");
  if (data.resumo && data.resumo.mes_mais_recente) {
    select.value = data.resumo.mes_mais_recente;
  } else if (meses.length > 0) {
    select.value = meses[meses.length - 1].value;
  }
  select.addEventListener("change", onMesChange);

  renderChartEvolucao();
  onMesChange();
}

fetch("data/falcao_sst.json")
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(init)
  .catch(err => {
    document.getElementById("state-msg").innerHTML =
      `Não foi possível carregar <code>data/falcao_sst.json</code>.<br>` +
      `Rode o script de exportação localmente ou aguarde a primeira execução do GitHub Actions.<br>` +
      `<small>${esc(err.message)}</small>`;
  });
</script>
</body>
</html>
